name: Build All Platforms (Windows, Linux, macOS, Web/iOS/Android/Console PWA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: hitboy.exe
            artifact: HitBoys-Emulations-Windows-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: hitboy
            artifact: HitBoys-Emulations-Linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: hitboy
            artifact: HitBoys-Emulations-macOS-AppleSilicon
          - os: macos-13
            target: x86_64-apple-darwin
            bin: hitboy
            artifact: HitBoys-Emulations-macOS-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI/audio deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libgtk-3-dev libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --package hitboy --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}

  build-web-pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli & LLVM
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          cargo install wasm-bindgen-cli --version 0.2.127
      - name: Build WebAssembly player (iOS / Android / Console PWA)
        run: |
          cargo build -p web --release --target wasm32-unknown-unknown
          wasm-bindgen --target web --no-typescript --out-dir dist-web target/wasm32-unknown-unknown/release/web.wasm
      - name: Upload WebAssembly PWA bundle
        uses: actions/upload-artifact@v4
        with:
          name: HitBoys-Emulations-Web-Mobile-Console-PWA
          path: dist-web/
